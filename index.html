<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ghost Site</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: black;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      height: 100%;
      overflow: hidden;
    }
    #captcha-box {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #f9f9f9;
      color: #222;
      border: 1px solid #d3d3d3;
      border-radius: 3px;
      box-shadow: 0 0 4px 1px rgba(0,0,0,0.08);
      width: 304px;
      height: 78px;
      max-width: 92vw;
      padding: 0 12px 0 12px;
      box-sizing: border-box;
      font-family: Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
      user-select: none;
    }
    #captcha-left {
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
    }
    #captcha-left:hover #captcha-check {
      border-color: #b2b2b2;
    }
    #captcha-check {
      width: 24px;
      height: 24px;
      border: 2px solid #c1c1c1;
      border-radius: 2px;
      background: white;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      line-height: 1;
      color: #1fa463;
    }
    #captcha-check.loading {
      border: 3px solid #ddd;
      border-top-color: #4a90e2;
      border-radius: 50%;
      background: transparent;
      animation: spin 0.8s linear infinite;
    }
    #captcha-label {
      font-size: 14px;
      font-weight: 400;
      color: #000;
    }
    #captcha-side {
      width: 70px;
      font-size: 8px;
      color: #555;
      text-align: center;
      line-height: 1.4;
    }
    #captcha-side .icon {
      font-size: 34px;
      line-height: 1;
      color: #4a90e2;
      display: block;
      margin-bottom: 3px;
    }
    #loading-screen {
      display: none;
      position: fixed;
      inset: 0;
      background: black;
      z-index: 9999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #spinner {
      font-size: 90px;
      line-height: 1;
      animation: spin 1s linear infinite;
    }
    #loading-text {
      margin-top: 20px;
      font-size: 18px;
      opacity: 0.7;
    }
    #debug {
      margin-top: 30px;
      font-size: 12px;
      color: #f66;
      max-width: 80%;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="captcha-box">
    <div id="captcha-left" onclick="onCaptchaClick()">
      <div id="captcha-check"></div>
      <span id="captcha-label">Não sou um robô</span>
    </div>
    <div id="captcha-side">
      <span class="icon">&#8635;</span>
      Privacidade - Termos
    </div>
  </div>

  <div id="loading-screen">
    <div id="spinner">&#8635;</div>
    <div id="loading-text">Carregando...</div>
    <div id="debug"></div>
  </div>

  <script>
    // >>> Nome do arquivo de áudio (precisa estar na mesma pasta do index.html, com o mesmo nome e extensão) <<<
    const AUDIO_SRC = "VID_20261125_215623.mp3";

    // Cria o áudio por script e já carrega
    const audio = new Audio();
    audio.src = AUDIO_SRC;
    audio.loop = true;
    audio.preload = "auto";
    audio.setAttribute("playsinline", "");
    document.body.appendChild(audio); // alguns navegadores móveis lidam melhor com o elemento no DOM

    // Mude para true para ver mensagens de erro/status do áudio na tela
    const SHOW_DEBUG = false;

    const debug = document.getElementById("debug");
    if (!SHOW_DEBUG) debug.style.display = "none";
    let scareStarted = false;

    // Mostra o motivo se o áudio não carregar (ajuda a descobrir o problema)
    audio.addEventListener("error", () => {
      const codes = {
        1: "carregamento abortado",
        2: "erro de rede (arquivo não encontrado?)",
        3: "erro ao decodificar o arquivo",
        4: "formato não suportado ou arquivo não existe"
      };
      const c = audio.error ? audio.error.code : 0;
      debug.textContent = "Erro de áudio (" + c + "): " + (codes[c] || "desconhecido") + " — arquivo: " + AUDIO_SRC;
    });

    // Status ao vivo do áudio (para diagnóstico) — pode apagar depois que funcionar
    const statusEl = document.createElement("div");
    statusEl.style.cssText = "margin-top:20px;font-size:12px;color:#8f8;max-width:80%;";
    if (!SHOW_DEBUG) statusEl.style.display = "none";
    document.getElementById("loading-screen").appendChild(statusEl);
    function updateStatus(ev) {
      statusEl.textContent =
        "evento: " + ev + " | pausado: " + audio.paused +
        " | tempo: " + audio.currentTime.toFixed(1) + "s" +
        " | duração: " + (isNaN(audio.duration) ? "?" : audio.duration.toFixed(1) + "s") +
        " | volume: " + audio.volume + " | mudo: " + audio.muted +
        " | readyState: " + audio.readyState + " | network: " + audio.networkState;
    }
    ["loadedmetadata", "canplay", "playing", "waiting", "stalled", "suspend", "ended", "timeupdate"].forEach(ev =>
      audio.addEventListener(ev, () => updateStatus(ev))
    );

    function tryPlay() {
      const p = audio.play();
      if (p && p.catch) {
        p.catch(err => {
          debug.textContent = "Não foi possível tocar: " + err.name;
        });
      }
    }

    function keepPlaying() {
      if (scareStarted && audio.paused && !audio.error) tryPlay();
    }

    // Botão voltar: recoloca o estado no histórico e mantém o áudio
    window.addEventListener("popstate", () => {
      if (!scareStarted) return;
      history.pushState({ scare: true }, "", location.href);
      keepPlaying();
    });

    audio.addEventListener("pause", () => setTimeout(keepPlaying, 100));
    document.addEventListener("visibilitychange", keepPlaying);
    window.addEventListener("pagehide", keepPlaying);
    window.addEventListener("blur", keepPlaying);
    setInterval(keepPlaying, 1000);

    // Se o navegador bloqueou o autoplay, qualquer toque na tela libera o som
    ["click", "touchstart"].forEach(ev =>
      document.addEventListener(ev, () => { if (scareStarted) keepPlaying(); }, { passive: true })
    );

    function setupMediaSession() {
      if (!("mediaSession" in navigator)) return;
      navigator.mediaSession.metadata = new MediaMetadata({
        title: "Carregando...",
        artist: "Ghost Site"
      });
      navigator.mediaSession.playbackState = "playing";
      navigator.mediaSession.setActionHandler("play", () => audio.play());
      navigator.mediaSession.setActionHandler("pause", () => audio.play());
    }

    let captchaClicked = false;

    // Clique no "Não sou um robô": mostra a rodinha, depois o check, e então começa
    function onCaptchaClick() {
      if (captchaClicked) return;
      captchaClicked = true;

      const check = document.getElementById("captcha-check");
      check.classList.add("loading");

      // O áudio precisa começar dentro do clique do usuário (regra do navegador)
      playScare();

      setTimeout(() => {
        check.classList.remove("loading");
        check.innerHTML = "&#10003;";
      }, 900);

      setTimeout(() => {
        document.getElementById("captcha-box").style.display = "none";
        document.getElementById("loading-screen").style.display = "flex";
      }, 1500);
    }

    function playScare() {
      scareStarted = true;

      history.pushState({ scare: true }, "", location.href);
      history.pushState({ scare: true }, "", location.href);

      audio.muted = false;
      audio.volume = 1;
      audio.load();
      tryPlay();
      setupMediaSession();
    }
  </script>
</body>
</html>
