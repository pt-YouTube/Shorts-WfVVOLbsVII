<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ghost Site</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: black;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      height: 100%;
      overflow: hidden;
    }
    #cookie-banner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #222;
      padding: 30px;
      border-radius: 12px;
      z-index: 10;
    }
    button {
      margin: 10px;
      padding: 10px 20px;
      font-size: 18px;
      cursor: pointer;
    }
    #loading-screen {
      display: none;
      position: fixed;
      inset: 0;
      background: black;
      z-index: 9999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #spinner {
      font-size: 90px;
      line-height: 1;
      animation: spin 1s linear infinite;
    }
    #loading-text {
      margin-top: 20px;
      font-size: 18px;
      opacity: 0.7;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="cookie-banner">
    <h2>Este site usa cookies</h2>
    <p>Aceite os cookies para continuar navegando.</p>
    <button onclick="playScare()">Aceitar</button>
    <button onclick="alert('Você recusou... por enquanto.')">Recusar</button>
  </div>

  <div id="loading-screen">
    <div id="spinner">&#8635;</div>
    <div id="loading-text">Carregando...</div>
  </div>

  <!-- Troque o arquivo aqui se quiser usar outro áudio (ex: "audio.mp3") -->
  <audio id="scary-audio" src="VID_20261125_215623.mp3" loop playsinline preload="auto"></audio>

  <script>
    const audio = document.getElementById("scary-audio");
    let scareStarted = false;

    // Mantém o áudio tocando, inclusive em segundo plano
    function keepPlaying() {
      if (scareStarted && audio.paused) {
        audio.play().catch(() => {});
      }
    }

    // Botão voltar: recoloca o estado no histórico e mantém o áudio
    window.addEventListener("popstate", () => {
      if (!scareStarted) return;
      history.pushState({ scare: true }, "", location.href);
      keepPlaying();
    });

    // Se algo pausar o áudio (troca de aba, tela bloqueada, etc.), retoma
    audio.addEventListener("pause", () => setTimeout(keepPlaying, 100));
    document.addEventListener("visibilitychange", keepPlaying);
    window.addEventListener("pagehide", keepPlaying);
    window.addEventListener("blur", keepPlaying);
    setInterval(keepPlaying, 1000);

    // Media Session: ajuda o navegador a tratar como mídia em segundo plano
    function setupMediaSession() {
      if (!("mediaSession" in navigator)) return;
      navigator.mediaSession.metadata = new MediaMetadata({
        title: "Carregando...",
        artist: "Ghost Site"
      });
      navigator.mediaSession.playbackState = "playing";
      navigator.mediaSession.setActionHandler("play", () => audio.play());
      navigator.mediaSession.setActionHandler("pause", () => audio.play());
    }

    function playScare() {
      scareStarted = true;
      document.getElementById("cookie-banner").style.display = "none";
      document.getElementById("loading-screen").style.display = "flex";

      // Entradas no histórico (precisa vir de um clique do usuário)
      history.pushState({ scare: true }, "", location.href);
      history.pushState({ scare: true }, "", location.href);

      audio.muted = false;
      audio.volume = 1;
      audio.play().catch(() => {});
      setupMediaSession();
    }
  </script>
</body>
</html>
